# Required before merge: the app builds, the unit tests pass, and lint finds no new errors.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The Ubuntu runner already has the Android SDK (ANDROID_HOME); setup-android@v3 fails on its
      # newer command-line tools, and Gradle fetches any missing platform itself.
      # -PnoPi=true skips packing Node and the Pi harness into the APK (scripts/build-node-runtime.sh).
      - name: Unit tests
        run: ./gradlew -PnoPi=true :policy:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew -PnoPi=true :app:lintDebug
      - name: Build
        run: ./gradlew -PnoPi=true :app:assembleDebug
